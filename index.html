<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Core IA - Asistente de inteligencia artificial" />
  <title>Core IA</title>
  <style>
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --surface: #2f2f2f;
      --surface-2: #262626;
      --hover: #2a2a2a;
      --border: #3a3a3a;
      --text: #ececec;
      --muted: #9b9b9b;
      --accent: #7c5cff;
      --accent-soft: rgba(124, 92, 255, .16);
      --user-bubble: #2f2f2f;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; }

    /* ---------- Layout ---------- */
    .app { display: flex; height: 100dvh; overflow: hidden; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 264px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 14px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: .2px;
    }

    .brand-logo {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #4da3ff);
      display: grid; place-items: center;
      font-size: 15px; font-weight: 800; color: #fff;
    }

    .new-chat {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 11px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      transition: background .15s, border-color .15s;
    }
    .new-chat:hover { background: var(--hover); border-color: #4a4a4a; }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      padding: 14px 10px 6px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: 2px;
    }

    .history-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 13.5px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .15s, color .15s;
    }
    .history-item:hover { background: var(--hover); color: var(--text); }
    .history-item.active { background: var(--surface); color: var(--text); }
    .history-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

    /* ---------- Perfil ---------- */
    .profile {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 4px;
    }

    .user-card {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
    }
    .user-card:hover { background: var(--hover); }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
      flex-shrink: 0;
    }

    .user-meta { min-width: 0; flex: 1; }
    .user-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-sub { font-size: 12px; color: var(--muted); }

    .icon-btn {
      background: transparent; border: none; color: var(--muted);
      padding: 6px; border-radius: 8px; display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }

    .login-btn {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%;
      padding: 11px 12px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: filter .15s;
    }
    .login-btn:hover { filter: brightness(1.1); }

    /* ---------- Main ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .topbar {
      height: 56px;
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
    }

    .menu-btn { display: none; }

    .model-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 600;
      color: var(--text);
    }
    .model-badge .pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52, 211, 153, .6);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .5); }
      70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 28px 16px 150px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ---------- Bienvenida ---------- */
    .welcome {
      max-width: 620px;
      margin: 8vh auto 0;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 0 16px;
    }
    .welcome h1 { font-size: 30px; font-weight: 700; }
    .welcome .grad {
      background: linear-gradient(135deg, var(--accent), #4da3ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .welcome p { color: var(--muted); font-size: 15px; line-height: 1.6; }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }
    .suggestion {
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 13.5px;
      transition: background .15s, border-color .15s;
    }
    .suggestion:hover { background: var(--hover); border-color: #4a4a4a; }

    /* ---------- Mensajes ---------- */
    .msg { display: flex; gap: 14px; }
    .msg .bubble {
      max-width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .msg.user { justify-content: flex-end; }
    .msg.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--border);
      border-bottom-right-radius: 5px;
    }
    .msg.bot .bubble {
      background: transparent;
      padding-left: 4px;
      border-bottom-left-radius: 5px;
    }
    .msg .role-icon {
      width: 32px; height: 32px; flex-shrink: 0;
      border-radius: 9px;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--accent), #4da3ff);
    }

    .typing { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
    .typing .dots { display: inline-flex; gap: 4px; }
    .typing .dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: blink 1.4s infinite both;
    }
    .typing .dots span:nth-child(2) { animation-delay: .2s; }
    .typing .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

    .msg.error .bubble { color: #fca5a5; border: 1px solid #7f1d1d; background: rgba(127,29,29,.15); }

    /* ---------- Input ---------- */
    .composer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 14px 16px 18px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }
    .composer-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 8px 8px 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      transition: border-color .15s;
    }
    .composer-inner:focus-within { border-color: #5a5a5a; }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      max-height: 180px;
      padding: 8px 0;
    }
    #input::placeholder { color: var(--muted); }

    #send {
      width: 38px; height: 38px;
      border: none; border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
    }
    #send:hover { transform: translateY(-1px); }
    #send:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .composer-hint {
      max-width: 780px;
      margin: 8px auto 0;
      text-align: center;
      font-size: 11.5px;
      color: #6f6f6f;
    }

    /* ---------- Overlay (mobile) ---------- */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 30;
    }
    .overlay.show { display: block; }

    /* ---------- Responsive ---------- */
    @media (max-width: 820px) {
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        z-index: 40;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: grid; }
      .welcome h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo">C</span>
        <span>Core IA</span>
      </div>

      <button class="new-chat" id="new-chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo chat
      </button>

      <div class="section-label">Historial</div>
      <div class="history" id="history"></div>

      <div class="profile" id="profile"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menú">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="model-badge">
          <span class="pulse"></span>
          Core IA
        </div>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-inner" id="chat"></div>
        <div class="welcome" id="welcome">
          <h1>¿En qué puede ayudarte <span class="grad">Core IA</span>?</h1>
          <p>Tu asistente de inteligencia artificial. Inicia sesión con Discord para comenzar.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explícame la arquitectura de un backend FastAPI escalable">Explícame una arquitectura backend</button>
            <button class="suggestion" data-prompt="Escribe una función en Python que procese un CSV paso a paso">Ayúdame a escribir código Python</button>
            <button class="suggestion" data-prompt="Dame ideas para desplegar una app full-stack">Ideas de despliegue full-stack</button>
            <button class="suggestion" data-prompt="Resume las ventajas de OAuth2 frente a sesiones tradicionales">OAuth2 vs sesiones</button>
          </div>
        </div>
      </div>

      <form class="composer" id="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="Escribe un mensaje a Core IA..." autocomplete="off"></textarea>
          <button id="send" type="submit" aria-label="Enviar" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
          </button>
        </div>
        <div class="composer-hint">Core IA puede cometer errores. Verifica la información importante.</div>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
