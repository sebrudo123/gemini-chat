<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --user: #2563eb;
      --bot: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      font-weight: 600;
      letter-spacing: .3px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
      animation: fade .2s ease;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
    }

    .msg.typing { color: var(--muted); font-style: italic; }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
    }

    .input-bar {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: var(--surface);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 8px 8px 8px 16px;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      resize: none;
      max-height: 140px;
    }

    #send {
      background: var(--user);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity .2s;
    }

    #send:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>Chat IA</header>

  <main id="chat"></main>

  <footer>
    <form class="input-bar" id="form">
      <textarea id="input" rows="1" placeholder="Escribe un mensaje..." autocomplete="off"></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
  </footer>

  <script src="script.js"></script>
</body>
</html>
