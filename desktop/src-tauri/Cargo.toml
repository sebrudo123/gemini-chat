[package]
name = "coreia-studio"
version = "0.1.0"
description = "Core IA Studio — chat de agentes de escritorio"
authors = ["Core IA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coreia_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
