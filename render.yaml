services:
  - type: web
    name: gemini-chat-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_MAX_AGE
        value: "604800"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://gemini-chat-backend-vyrz.onrender.com/api/auth/discord/callback
      - key: FRONTEND_URL
        value: https://sebrudo123.github.io/gemini-chat
      - key: ALLOWED_ORIGINS
        value: https://sebrudo123.github.io,https://gemini-chat-backend-six.vercel.app,http://localhost:5500,http://127.0.0.1:5500
