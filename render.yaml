services:
  - type: web
    name: gemini-chat-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_MODEL_FALLBACKS
        value: gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.7-flash,gemini-flash-latest
      - key: AI_RETRIES
        value: "2"
      - key: IMAGE_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: RAG_ENABLED
        value: "true"
      - key: RAG_TOP_K
        value: "4"
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_MAX_AGE
        value: "604800"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://gemini-chat-backend-vyrz.onrender.com/api/auth/discord/callback
      - key: AUTH_PROVIDERS
        value: discord
      - key: FOUNDER_DISCORD_IDS
        value: "1439761085040427100"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Core IA <onboarding@resend.dev>"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: TOTP_ISSUER
        value: "Core IA"
      - key: FRONTEND_URL
        value: https://sebrudo123.github.io/gemini-chat
      - key: ALLOWED_ORIGINS
        value: https://sebrudo123.github.io,https://gemini-chat-backend-six.vercel.app,http://localhost:5500,http://127.0.0.1:5500
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT
        value: 30/minute
      - key: BACKEND_URL
        value: https://gemini-chat-backend-vyrz.onrender.com
      - key: METRICS_REQUIRE_ADMIN
        value: "true"
      - key: METRICS_IP_ALLOWLIST
        sync: false
