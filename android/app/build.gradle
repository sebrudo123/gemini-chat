plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("KEYSTORE_FILE")
def hasKeystore = keystorePath != null && !keystorePath.trim().isEmpty() && file(keystorePath).exists()

android {
    namespace "com.coreia.app"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.coreia.app"
        minSdk 24
        targetSdk 34
        versionCode System.getenv("VERSION_CODE") != null ? System.getenv("VERSION_CODE").toInteger() : 1
        versionName System.getenv("VERSION_NAME") != null ? System.getenv("VERSION_NAME") : "1.0.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            // Solo arquitecturas ARM (cubren prácticamente todos los móviles).
            // Reduce el tamaño del APK: el SDK de Discord aporta ~13 MB por ABI.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            def debugKeystore = file("debug.keystore")
            if (debugKeystore.exists()) {
                storeFile debugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.8.22"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.core:core:1.13.1"
    implementation files("libs/discord_partner_sdk.jar")
}
