plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("KEYSTORE_FILE")
def hasKeystore = keystorePath != null && !keystorePath.trim().isEmpty() && file(keystorePath).exists()

android {
    namespace "com.coreia.botpanel"
    compileSdk 34

    defaultConfig {
        applicationId "com.coreia.botpanel"
        minSdk 24
        targetSdk 34
        versionCode System.getenv("VERSION_CODE") != null ? System.getenv("VERSION_CODE").toInteger() : 1
        versionName System.getenv("VERSION_NAME") != null ? System.getenv("VERSION_NAME") : "1.0.0"

        // URL del panel web del bot. Es donde FastAPI sirve /bot en el backend.
        // SIEMPRE con barra final: el HTML carga su JS relativo (bot.js), y sin
        // la barra el WebView pide /bot.js (404) y el panel queda sin JavaScript
        // (botones de login muertos).
        def panelUrl = System.getenv("BOT_PANEL_URL")
            ?: "https://gemini-chat-backend-vyrz.onrender.com/bot"
        if (!panelUrl.endsWith("/")) {
            panelUrl = panelUrl + "/"
        }
        buildConfigField("String", "PANEL_URL", "\"${panelUrl}\"")
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        debug {
            def debugKeystore = file("debug.keystore")
            if (debugKeystore.exists()) {
                storeFile debugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    //.kotlin-stdlib-jdk8 ya forma parte de kotlin-stdlib (evita clases duplicadas).
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 ahora está integrado en kotlin-stdlib.")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 ahora está integrado en kotlin-stdlib.")
        }
    }
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}
