name: Core IA Bot — APK

on:
  push:
    branches: [ main ]
    paths:
      - "androidbot/**"
      - "bot/**"
      - "backend/main.py"
      - ".github/workflows/android-bot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidbot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: androidbot/app/debug.keystore
          key: androidbot-debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reutilizando debug.keystore en caché (firma estable)."
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coreia.keystore"
            echo "Keystore configurado correctamente."
          else
            echo "Sin keystore en secrets; se usará firma debug."
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/coreia.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk coreia-bot.apk
          else
            echo "::warning::No hay keystore configurado; se genera un APK debug."
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk coreia-bot.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreia-bot-apk
          path: androidbot/coreia-bot.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gh release view "bot-panel-$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "bot-panel-$VERSION_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Core IA Bot $VERSION_NAME" \
            --notes "APK aparte del panel de administración del bot de Discord." \
            coreia-bot.apk
