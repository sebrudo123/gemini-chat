name: Core IA Bot — APK

on:
  push:
    branches: [ main ]
    paths:
      - "androidbot/**"
      - "bot/**"
      - "backend/main.py"
      - ".github/workflows/android-bot.yml"
  workflow_dispatch:
    inputs:
      changelog:
        description: "Novedades de la versión (una mejora por línea)"
        required: false
        default: "Mejoras y arreglos de errores."

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidbot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Cache debug keystore
        uses: actions/cache@v6
        with:
          path: androidbot/app/debug.keystore
          key: androidbot-debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reutilizando debug.keystore en caché (firma estable)."
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coreia.keystore"
            echo "Keystore configurado correctamente."
          else
            echo "Sin keystore en secrets; se usará firma debug."
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/coreia.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk coreia-bot.apk
          else
            echo "::warning::No hay keystore configurado; se genera un APK debug."
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk coreia-bot.apk
          fi

      # Changelog real: input del dispatch o mensaje del último commit en push.
      - name: Derive changelog
        env:
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        working-directory: .
        run: |
          if [ -n "$INPUT_CHANGELOG" ]; then
            echo "CHANGELOG=$INPUT_CHANGELOG" >> "$GITHUB_ENV"
          else
            git log -1 --pretty='format:%s' > /tmp/changelog.txt
            echo "CHANGELOG=$(cat /tmp/changelog.txt)" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreia-bot-apk
          path: androidbot/coreia-bot.apk
          if-no-files-found: error

      - name: Publish update to backend
        env:
          UPLOAD_TOKEN: ${{ secrets.BACKEND_UPLOAD_TOKEN }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          CHANGELOG: ${{ env.CHANGELOG }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          token = os.environ.get("UPLOAD_TOKEN", "").strip()
          if not token:
              print("Sin BACKEND_UPLOAD_TOKEN; el APK queda solo como artifact.")
              raise SystemExit(0)

          with open("coreia-bot.apk", "rb") as fh:
              apk_b64 = base64.b64encode(fh.read()).decode()

          body = json.dumps({
              "version_code": int(os.environ["VERSION_CODE"]),
              "version_name": os.environ["VERSION_NAME"],
              "changelog": os.environ.get("CHANGELOG", "Mejoras y arreglos de errores."),
              "apk_base64": apk_b64,
              "release_url": os.environ.get("RELEASE_URL", ""),
          }).encode()

          req = urllib.request.Request(
              "https://gemini-chat-backend-vyrz.onrender.com/api/bot/update/upload",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "x-upload-token": token,
              },
          )
          with urllib.request.urlopen(req, timeout=300) as res:
              print("Backend:", res.read().decode())
          PY
