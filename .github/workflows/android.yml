name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "index.html"
      - "script.js"
      - "manifest.webmanifest"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: android-debug-keystore-v2

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reutilizando debug.keystore en caché (firma estable)."
          fi

      - name: Copy web assets into the APK
        run: |
          mkdir -p app/src/main/assets/www
          cp ../index.html app/src/main/assets/www/index.html
          cp ../script.js app/src/main/assets/www/script.js
          [ -f ../manifest.webmanifest ] && cp ../manifest.webmanifest app/src/main/assets/www/manifest.webmanifest || true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coreia.keystore"
            echo "Keystore configurado correctamente."
          else
            echo "Sin keystore en secrets; se usará firma debug."
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/coreia.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk coreia.apk
          else
            echo "::warning::No hay keystore configurado; se genera un APK debug. Configura los secrets para que la actualización automática funcione."
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk coreia.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreia-apk
          path: android/coreia.apk
          if-no-files-found: error

      - name: Generate changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION_CODE: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def run(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          prev = run("git", "describe", "--tags", "--abbrev=0") or ""
          rng = f"{prev}..HEAD" if prev else "HEAD"
          commits = [c.strip() for c in run("git", "log", rng, "--pretty=format:%s").splitlines() if c.strip()]

          novedades, correcciones, internos = [], [], []
          for line in commits:
              low = line.lower()
              if low.startswith("feat"):
                  novedades.append(line)
              elif low.startswith("fix"):
                  correcciones.append(line)
              else:
                  internos.append(line)

          parts = [f"Nueva versión automática generada desde GitHub Actions.",
                   f"VersionCode: {os.environ['VERSION_CODE']}",
                   f"VersionName: 1.0.{os.environ['VERSION_CODE']}",
                   "Descarga: coreia.apk"]
          if novedades:
              parts.append("## ✨ Novedades\n" + "\n".join(f"- {x}" for x in novedades))
          if correcciones:
              parts.append("## 🐛 Correcciones\n" + "\n".join(f"- {x}" for x in correcciones))
          if internos:
              parts.append("## 🔧 Interno y otros\n" + "\n".join(f"- {x}" for x in internos))
          tag = f"v1.0.{os.environ['VERSION_CODE']}"
          base = prev if prev else "main"
          parts.append(f"**Full Changelog**: https://github.com/{os.environ['REPO']}/compare/{base}...{tag}")

          with open("CHANGELOG_BODY.md", "w") as fh:
              fh.write("\n\n".join(parts) + "\n")
          PY

      - name: Publish APK to a Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Core IA v1.0.${{ github.run_number }}
          body_path: android/CHANGELOG_BODY.md
          files: android/coreia.apk
          make_latest: true
