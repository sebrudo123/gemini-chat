name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "index.html"
      - "script.js"
      - "manifest.webmanifest"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Copy web assets into the APK
        run: |
          mkdir -p app/src/main/assets/www
          cp ../index.html app/src/main/assets/www/index.html
          cp ../script.js app/src/main/assets/www/script.js
          [ -f ../manifest.webmanifest ] && cp ../manifest.webmanifest app/src/main/assets/www/manifest.webmanifest || true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coreia.keystore"
            echo "Keystore configurado correctamente."
          else
            echo "Sin keystore en secrets; se usará firma debug."
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/coreia.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk coreia.apk
          else
            echo "::warning::No hay keystore configurado; se genera un APK debug. Configura los secrets para que la actualización automática funcione."
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk coreia.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: coreia-apk
          path: android/coreia.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Core IA v1.0.${{ github.run_number }}
          body: |
            Nueva versión automática generada desde GitHub Actions.
            VersionCode: ${{ github.run_number }}
            VersionName: 1.0.${{ github.run_number }}
            Descarga: coreia.apk
          files: android/coreia.apk
          make_latest: true
          generate_release_notes: true
