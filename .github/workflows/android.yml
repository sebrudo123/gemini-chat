name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "index.html"
      - "script.js"
      - "discord-rpc.js"
      - "sw.js"
      - "favicon.svg"
      - "manifest.webmanifest"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: android-debug-keystore-v2

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reutilizando debug.keystore en caché (firma estable)."
          fi

      - name: Copy web assets into the APK
        run: |
          mkdir -p app/src/main/assets/www
          cp ../index.html app/src/main/assets/www/index.html
          cp ../script.js app/src/main/assets/www/script.js
          [ -f ../discord-rpc.js ] && cp ../discord-rpc.js app/src/main/assets/www/discord-rpc.js || true
          [ -f ../favicon.svg ] && cp ../favicon.svg app/src/main/assets/www/favicon.svg || true
          [ -f ../sw.js ] && cp ../sw.js app/src/main/assets/www/sw.js || true
          [ -f ../manifest.webmanifest ] && cp ../manifest.webmanifest app/src/main/assets/www/manifest.webmanifest || true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coreia.keystore"
            echo "Keystore configurado correctamente."
          else
            echo "Sin keystore en secrets; se usará firma debug."
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/coreia.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk coreia.apk
          else
            echo "::warning::No hay keystore configurado; se genera un APK debug. Configura los secrets para que la actualización automática funcione."
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk coreia.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreia-apk
          path: android/coreia.apk
          if-no-files-found: error

      - name: Generate changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION_CODE: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def run(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          prev = run("git", "describe", "--tags", "--abbrev=0") or ""
          rng = f"{prev}..HEAD" if prev else "HEAD"
          commits = [c.strip() for c in run("git", "log", rng, "--pretty=format:%s").splitlines() if c.strip()]

          novedades, correcciones, internos = [], [], []
          for line in commits:
              low = line.lower()
              if low.startswith("feat"):
                  novedades.append(line)
              elif low.startswith("fix"):
                  correcciones.append(line)
              else:
                  internos.append(line)

          parts = [f"Nueva versión automática generada desde GitHub Actions.",
                   f"VersionCode: {os.environ['VERSION_CODE']}",
                   f"VersionName: 1.0.{os.environ['VERSION_CODE']}",
                   "Descarga: coreia.apk"]
          if novedades:
              parts.append("## ✨ Novedades\n" + "\n".join(f"- {x}" for x in novedades))
          if correcciones:
              parts.append("## 🐛 Correcciones\n" + "\n".join(f"- {x}" for x in correcciones))
          if internos:
              parts.append("## 🔧 Interno y otros\n" + "\n".join(f"- {x}" for x in internos))
          tag = f"v1.0.{os.environ['VERSION_CODE']}"
          base = prev if prev else "main"
          parts.append(f"**Full Changelog**: https://github.com/{os.environ['REPO']}/compare/{base}...{tag}")

          env_path = os.environ.get("GITHUB_ENV", "")
          with open(env_path, "a") as fh:
              # Formato delimitado de GITHUB_ENV (soporta varias líneas).
              fh.write("CHANGELOG<<EOF\n" + "\n".join(commits)[:3000] + "\nEOF\n")

          with open("CHANGELOG_BODY.md", "w") as fh:
              fh.write("\n\n".join(parts) + "\n")
          PY

      # Publica la APK de la IA en el backend: activa el aviso del bot en
      # Discord y la auto-actualización de la app (sin GitHub Releases).
      - name: Publish update to backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          UPLOAD_TOKEN: ${{ secrets.BACKEND_UPLOAD_TOKEN }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          CHANGELOG: ${{ env.CHANGELOG }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error

          token = os.environ.get("UPLOAD_TOKEN", "").strip()
          if not token:
              print("Sin BACKEND_UPLOAD_TOKEN; la IA queda solo como artifact.")
              raise SystemExit(0)

          changelog = " ".join(
              os.environ.get("CHANGELOG", "").split()
          ) or "Mejoras y arreglos de errores."
          with open("coreia.apk", "rb") as fh:
              apk_b64 = base64.b64encode(fh.read()).decode()

          body = json.dumps({
              "version_code": int(os.environ["VERSION_CODE"]),
              "version_name": os.environ["VERSION_NAME"],
              "changelog": changelog,
              "apk_base64": apk_b64,
              "app": "ia",
          }).encode()

          last_err = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(
                      "https://coreiabackend.onrender.com/api/bot/update/upload",
                      data=body, method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "x-upload-token": token,
                          "User-Agent": "coreia-actions/1.0",
                      },
                  )
                  result = json.load(urllib.request.urlopen(req, timeout=300))
                  print("Publicado:", result)
                  raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  last_err = e
                  detalle = e.read().decode("utf-8", "replace")[:200]
                  if e.code in (502, 503, 504) and attempt < 3:
                      print(f"Backend respondió {e.code}, reintentando en 10s... ({detalle})")
                      time.sleep(10)
                      continue
                  print(f"Backend respondió {e.code}: {detalle}")
                  raise SystemExit(1)
              except Exception as e:
                  last_err = e
                  if attempt < 3:
                      print(f"Error de conexión, reintentando en 10s: {e}")
                      time.sleep(10)
                      continue
                  print(f"Error final: {e}")
                  raise SystemExit(1)
          if last_err:
              raise SystemExit(1)
          PY
              headers={"Content-Type": "application/json",
                       "x-upload-token": token,
                       "User-Agent": "coreia-actions/1.0"})
          result = json.load(urllib.request.urlopen(req, timeout=300))
          print("Publicado:", result)
          PY

