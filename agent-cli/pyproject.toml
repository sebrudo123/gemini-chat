[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coreia-agent"
version = "0.1.0"
description = "CLI de agentes de Core IA: chat con sesiones y herramientas locales"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Core IA" }]
keywords = ["ai", "agent", "cli", "coreia"]
dependencies = []

[project.scripts]
coreia = "coreia_agent.cli:main"

[tool.setuptools.packages.find]
include = ["coreia_agent*"]
